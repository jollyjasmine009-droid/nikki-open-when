<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Nikki ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">

    <style>

    body {
    background: #f7f0df;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    box-sizing: border-box;
}
        img {
    margin: 15px 0;
}
        .photo-collage {
    position: relative;
    width: 340px;
    height: 480px;
    margin: 20px auto 10px;
}

.photo {
    position: absolute;
    object-fit: cover;
    background: white;
    padding: 9px;
    box-sizing: border-box;
    box-shadow: 0 5px 14px rgba(80, 60, 50, 0.16);

    /* soft old-photo look */
    filter: sepia(12%) saturate(82%) contrast(94%) brightness(103%);
}

.main-photo {
    width: 275px;
    height: 350px;
    left: 32px;
    top: 65px;
    transform: rotate(-2deg);
    z-index: 3;
}

.photo1 {
    width: 125px;
    height: 155px;
    left: 0;
    top: 20px;
    transform: rotate(-7deg);
    z-index: 2;
}

.photo2 {
    width: 130px;
    height: 155px;
    right: 0;
    top: 5px;
    transform: rotate(6deg);
    z-index: 2;
}

.photo3 {
    width: 120px;
    height: 145px;
    left: 5px;
    bottom: 25px;
    transform: rotate(5deg);
    z-index: 4;
}

.photo4 {
    width: 135px;
    height: 160px;
    right: 0;
    bottom: 10px;
    transform: rotate(-5deg);
    z-index: 2;
}

.photo5 {
    width: 110px;
    height: 135px;
    right: 35px;
    top: 175px;
    transform: rotate(8deg);
    z-index: 4;
}
    .decorations {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.decorations span {
    position: absolute;
    color: #d6b35a;
    pointer-events: none;
}

.decorations .blur-star {
    filter: blur(2px);
    opacity: 0.55;
}

.decorations .soft-star {
    filter: blur(0.7px);
    opacity: 0.7;
}

.star1 {
    top: 12%;
    left: 15%;
    font-size: 24px;
}

.star2 {
    top: 20%;
    right: 14%;
    font-size: 18px;
}

.star3 {
    top: 42%;
    left: 8%;
    font-size: 20px;
}

.star4 {
    bottom: 22%;
    right: 10%;
    font-size: 26px;
}

.star5 {
    bottom: 12%;
    left: 18%;
    font-size: 16px;
}
        .star6 {
    top: 8%;
    left: 42%;
    font-size: 13px;
}

.star7 {
    top: 31%;
    left: 3%;
    font-size: 14px;
}

.star8 {
    top: 35%;
    right: 5%;
    font-size: 11px;
}

.star9 {
    top: 57%;
    left: 14%;
    font-size: 17px;
}

.star10 {
    top: 65%;
    right: 6%;
    font-size: 14px;
}

.star11 {
    top: 16%;
    left: 29%;
    font-size: 19px;
}

.star12 {
    top: 47%;
    right: 18%;
    font-size: 25px;
}

.star13 {
    bottom: 29%;
    left: 5%;
    font-size: 18px;
}

.star14 {
    bottom: 7%;
    right: 25%;
    font-size: 21px;
}

.star15 {
    top: 74%;
    left: 24%;
    font-size: 12px;
}

.star16 {
    bottom: 18%;
    right: 4%;
    font-size: 15px;
}
h1 {
    font-family: "Parisienne", cursive;
    font-size: 64px;
    font-weight: 400;
    color: #5b4a42;
    margin-bottom: 10px;
}

body {
    font-family: "Cormorant Garamond", serif;
}
</style>
</head>

<body>
   <h1>for Nikki ♡</h1> 
    <div class="decorations">

    <span class="star star1">✦</span>
    <span class="star star2">✧</span>
    <span class="star star3">⋆</span>
    <span class="star star4">✦</span>
    <span class="star star5">✧</span>

    <span class="star star6">⋆</span>
    <span class="star star7">✦</span>
    <span class="star star8">✧</span>
    <span class="star star9">⋆</span>
    <span class="star star10">✦</span>

    <span class="star blur-star star11">✦</span>
    <span class="star blur-star star12">⋆</span>
    <span class="star blur-star star13">✧</span>
    <span class="star blur-star star14">✦</span>

    <span class="star soft-star star15">⋆</span>
    <span class="star soft-star star16">✧</span>

</div>

    
  <div class="photo-collage">

    <img src="nikki-closeup.jpeg" class="photo photo1" alt="Nikki">

    <img src="nikki-smile.jpeg" class="photo photo2" alt="Nikki">

    <img src="IMG_9714.jpeg" class="photo main-photo" alt="Nikki">

    <img src="nikki-green-shirt.jpeg" class="photo photo3" alt="Nikki">

    <img src="nikki-sleeping.jpeg" class="photo photo4" alt="Nikki">

    <img src="nikki-side-profile.jpeg" class="photo photo5" alt="Nikki">

</div>  

    <p>A little place for every version of you.</p>

    <button>begin our story ♡</button>

</body>
</html>
