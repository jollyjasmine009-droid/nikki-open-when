<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Nikki ♡</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">

<style>

body {
    background: #f7f0df;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    box-sizing: border-box;
    font-family: "Cormorant Garamond", serif;
    overflow-x: hidden;
}

h1 {
    font-family: "Parisienne", cursive;
    font-size: 64px;
    font-weight: 400;
    color: #5b4a42;
    margin: 0 0 20px;
}


/* =========================
   GOLD STARS
========================= */

.decorations {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.decorations span {
    position: absolute;
    color: #d6b35a;
    pointer-events: none;
}

.decorations .blur-star {
    filter: blur(2px);
    opacity: 0.55;
}

.decorations .soft-star {
    filter: blur(0.7px);
    opacity: 0.7;
}

.star1 { top: 12%; left: 15%; font-size: 24px; }
.star2 { top: 20%; right: 14%; font-size: 18px; }
.star3 { top: 42%; left: 8%; font-size: 20px; }
.star4 { bottom: 22%; right: 10%; font-size: 26px; }
.star5 { bottom: 12%; left: 18%; font-size: 16px; }

.star6 { top: 8%; left: 42%; font-size: 13px; }
.star7 { top: 31%; left: 3%; font-size: 14px; }
.star8 { top: 35%; right: 5%; font-size: 11px; }
.star9 { top: 57%; left: 14%; font-size: 17px; }
.star10 { top: 65%; right: 6%; font-size: 14px; }

.star11 { top: 16%; left: 29%; font-size: 19px; }
.star12 { top: 47%; right: 18%; font-size: 25px; }
.star13 { bottom: 29%; left: 5%; font-size: 18px; }
.star14 { bottom: 7%; right: 25%; font-size: 21px; }

.star15 { top: 74%; left: 24%; font-size: 12px; }
.star16 { bottom: 18%; right: 4%; font-size: 15px; }


/* =========================
   PAGE CONTENT
========================= */

.page-content {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}


/* =========================
   LITTLE BLUE BOX
========================= */

.memory-box {
    position: relative;
    width: 230px;
    height: 150px;
    margin: 30px auto 20px;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.memory-box:hover {
    transform: translateY(-4px) rotate(-1deg);
}

.box-base {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 230px;
    height: 105px;
    background: #b8cdd1;
    border: 3px solid #806c62;
    border-radius: 8px;
    box-sizing: border-box;
    box-shadow: 0 10px 20px rgba(80, 60, 50, 0.16);
}

.box-base::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px dashed rgba(91, 74, 66, 0.35);
    border-radius: 5px;
}

.box-lid {
    position: absolute;
    top: 15px;
    left: -8px;
    width: 246px;
    height: 42px;
    background: #c5d8db;
    border: 3px solid #806c62;
    border-radius: 8px;
    box-sizing: border-box;
    transform-origin: left center;

    transition:
        transform 0.8s cubic-bezier(.2,.8,.2,1),
        top 0.8s ease;

    z-index: 5;

    box-shadow: 0 5px 10px rgba(80, 60, 50, 0.12);
}

.box-lid::after {
    content: "for you ♡";
    position: absolute;
    width: 100%;
    text-align: center;
    top: 8px;
    left: 0;

    font-family: "Parisienne", cursive;
    font-size: 22px;
    color: #5b4a42;
}

.ribbon {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);

    width: 28px;
    height: 150px;

    background: rgba(214, 179, 90, 0.45);

    z-index: 6;
    pointer-events: none;
}

.ribbon::before {
    content: "";
    position: absolute;
    top: 8px;
    left: -8px;

    width: 44px;
    height: 30px;

    border: 2px solid #d6b35a;
    border-radius: 50%;
}

.box-text {
    position: absolute;
    z-index: 7;

    width: 100%;
    top: 73px;
    left: 0;

    font-family: "Parisienne", cursive;
    font-size: 27px;
    color: #5b4a42;

    pointer-events: none;
}

/* =========================
   PHOTO COLLAGE
========================= */

.photo-collage {
    position: relative;

    width: 360px;
    height: 610px;

    margin: 20px auto;

    overflow: visible;

    border-radius: 22px;

    opacity: 0;
    transform: scale(0.72);

    pointer-events: none;

    background: #eee4d1;

    box-shadow:
        0 8px 25px rgba(80, 60, 50, 0.15);

    transition:
        opacity 0.5s ease,
        transform 0.9s cubic-bezier(.2,.8,.2,1);
}
/* =========================
   PHOTOS
========================= */
.photo {
    position: absolute;

    width: auto;
    height: auto;
    object-fit: cover;
    padding: 0;
    box-sizing: border-box;
    border: none;

    box-shadow:
        0 5px 13px rgba(60, 45, 40, 0.18);

    filter:
        sepia(10%)
        saturate(85%)
        contrast(95%)
        brightness(103%);

    opacity: 0;

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1),
        opacity 0.55s ease;
}
 /* =========================
   COLLAGE POSITIONS
========================= */

.photo1 {
    width: 175px;
    height: 145px;
    left: 0;
    top: 0;
    z-index: 3;
}

.photo2 {
    width: 185px;
    height: 225px;
    right: 0;
    top: 0;
    z-index: 2;
}

.photo3 {
    width: 150px;
    height: 225px;
    left: 0;
    top: 125px;
    z-index: 4;
}

.photo9 {
    width: 135px;
    height: 150px;
    left: 125px;
    top: 105px;
    z-index: 9;
}

.main-photo {
    width: 205px;
    height: 275px;
    left: 82px;
    top: 220px;
    z-index: 7;
}

.photo4 {
    width: 150px;
    height: 235px;
    right: 0;
    top: 220px;
    z-index: 5;
}

.photo5 {
    width: 145px;
    height: 190px;
    left: 0;
    top: 390px;
    z-index: 8;
}

.photo7 {
    width: 175px;
    height: 160px;
    left: 0;
    bottom: 0;
    z-index: 3;
}

.photo10 {
    width: 150px;
    height: 175px;
    left: 105px;
    bottom: 0;
    z-index: 10;
}

.photo8 {
    width: 175px;
    height: 190px;
    right: 0;
    bottom: 0;
    z-index: 4;
}       

/* =========================
   OPENING ANIMATION
========================= */


/* Box opens */

.page-content.open .box-lid {
    transform:
        rotate(-18deg)
        translate(-15px, -45px);
}


/* Box disappears */

.page-content.open .memory-box {
    animation: boxDisappear 0.8s ease forwards;

    pointer-events: none;
}


@keyframes boxDisappear {

    0% {
        opacity: 1;
        transform: scale(1);
    }

    60% {
        opacity: 1;
        transform: scale(1.05);
    }

    100% {
        opacity: 0;
        transform: scale(0.8);
        visibility: hidden;
    }
}


/* Collage appears */

.page-content.open .photo-collage {
    opacity: 1;

    transform: scale(1);

    pointer-events: auto;
}



/* =========================
   PHOTO BLOOM
========================= */

/* Starting positions:
   every photo begins gathered around the box */

.photo {
    opacity: 0;

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1),
        opacity 0.55s ease;
}


/* =========================
   BLOOM STARTING POSITIONS
========================= */

.photo1 {
    transform: translate(90px, 270px) scale(0.15) rotate(-90deg);
}

.photo2 {
    transform: translate(-90px, 270px) scale(0.15) rotate(0deg);
}

.photo3 {
    transform: translate(100px, 180px) scale(0.15) rotate(0deg);
}

.photo4 {
    transform: translate(-100px, 100px) scale(0.15) rotate(0deg);
}

.photo5 {
    transform: translate(100px, -80px) scale(0.15) rotate(0deg);
}

.photo7 {
    transform: translate(90px, -170px) scale(0.15) rotate(0deg);
}

.photo8 {
    transform: translate(-90px, -170px) scale(0.15) rotate(0deg);
}

.photo9 {
    transform: translate(0, 180px) scale(0.15) rotate(90deg);
}

.photo10 {
    transform: translate(-10px, -180px) scale(0.15) rotate(0deg);
}

.main-photo {
    transform: translate(0, 0) scale(0.15) rotate(0deg);
}


/* =========================
   FINAL BLOOM POSITIONS
========================= */

.page-content.open .photo {
    opacity: 1;
    transform: translate(0, 0) scale(1) rotate(0deg);
}
    


/* When the box opens:
   photos bloom outward into their final positions */
.page-content.open .photo {
    opacity: 1;
    transform: translate(0, 0) scale(1) rotate(0deg);
}

  .page-content.open .photo1 {
    transform: translate(0, 0) scale(1) rotate(270deg);
}

.page-content.open .photo5 {
    transform: translate(0, 0) scale(1) rotate(270deg);
}
    .page-content.open .photo7 {
    transform: translate(0, 0) scale(1) rotate(-90deg);
}

.page-content.open .photo9 {
    transform: translate(0, 0) scale(1) rotate(-90deg);
}  

/* =========================
   STAGGERED APPEARANCE
========================= */

.photo1 {
    transition-delay: 0.10s;
}

.photo2 {
    transition-delay: 0.17s;
}

.main-photo {
    transition-delay: 0.24s;
}

.photo3 {
    transition-delay: 0.31s;
}

.photo4 {
    transition-delay: 0.38s;
}

.photo5 {
    transition-delay: 0.45s;
}

.photo6 {
    transition-delay: 0.52s;
}

.photo7 {
    transition-delay: 0.59s;
}

.photo8 {
    transition-delay: 0.66s;
}

.photo9 {
    transition-delay: 0.73s;
}

.photo10 {
    transition-delay: 0.80s;
}


/* =========================
   TEXT + BUTTON
========================= */

.subtitle {
    font-size: 20px;
    color: #5b4a42;
    margin: 5px 0 15px;
}

.story-button {
    background: #d6b35a;

    color: #fffaf0;

    border: none;

    padding: 12px 24px;

    border-radius: 30px;

    font-family: "Cormorant Garamond", serif;

    font-size: 18px;

    cursor: pointer;

    box-shadow:
        0 4px 10px rgba(80, 60, 50, 0.15);

    transition:
        transform 0.2s ease;
}

.story-button:hover {
    transform: translateY(-2px);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    h1 {
        font-size: 54px;
    }

    .photo-collage {
        transform: scale(0.9);
        transform-origin: top center;
        margin-bottom: -50px;
    }

    .page-content.open .photo-collage {
        transform: scale(0.9);
    }

}

</style>
</head>


<body>

<div class="decorations">

    <span class="star star1">✦</span>
    <span class="star star2">✧</span>
    <span class="star star3">⋆</span>
    <span class="star star4">✦</span>
    <span class="star star5">✧</span>

    <span class="star star6">⋆</span>
    <span class="star star7">✦</span>
    <span class="star star8">✧</span>
    <span class="star star9">⋆</span>
    <span class="star star10">✦</span>

    <span class="star blur-star star11">✦</span>
    <span class="star blur-star star12">⋆</span>
    <span class="star blur-star star13">✧</span>
    <span class="star blur-star star14">✦</span>

    <span class="star soft-star star15">⋆</span>
    <span class="star soft-star star16">✧</span>

</div>


<div class="page-content">

    <h1>for Nikki ♡</h1>


    <div class="memory-box" id="memoryBox">

        <div class="box-base"></div>

        <div class="ribbon"></div>

        <div class="box-lid"></div>

        <div class="box-text">
            open me ♡
        </div>

    </div>


    <div class="photo-collage">

    <!-- TOP LEFT -->
    <img src="36EBDDDE-E66D-4824-B125-8DF4A4C96DF0.jpeg"
         class="photo photo1"
         alt="Nikki">

    <!-- TOP RIGHT -->
    <img src="52B82AAE-72A0-4ADC-9D87-3EBC9D344F10.jpeg"
         class="photo photo2"
         alt="Nikki">

    <!-- LEFT MIDDLE -->
    <img src="IMG_9917.jpeg"
         class="photo photo3"
         alt="Nikki">

    <!-- UPPER CENTER -->
    <img src="IMG_9920.jpeg"
         class="photo photo9"
         alt="Nikki">

    <!-- BIG CENTER -->
    <img src="IMG_9714.jpeg"
         class="photo main-photo"
         alt="Nikki">

    <!-- RIGHT MIDDLE -->
    <img src="B8AC4CC4-754C-4490-B4F9-CC609C13EC6D.jpeg"
         class="photo photo4"
         alt="Nikki">

    <!-- LOWER LEFT -->
    <img src="IMG_9892.jpeg"
         class="photo photo5"
         alt="Nikki">

    <!-- LOWER LEFT / BOTTOM -->
    <img src="753B99A9-06E2-42A3-BC98-8C08C92C7657.jpeg"
         class="photo photo7"
         alt="Nikki">

    <!-- BOTTOM RIGHT -->
    <img src="IMG_9919.jpeg"
         class="photo photo8"
         alt="Nikki">

    <!-- BOTTOM CENTER -->
    <img src="IMG_9921.jpeg"
         class="photo photo10"
         alt="Nikki">

</div>
    <p class="subtitle">
        A little place for every version of you.
    </p>


    <button class="story-button">
        begin our story ♡
    </button>

</div>


<script>

const memoryBox = document.getElementById("memoryBox");
const pageContent = document.querySelector(".page-content");

memoryBox.addEventListener("click", function() {

    pageContent.classList.add("open");

});

</script>

</body>
</html>
