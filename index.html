<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Nikki ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">

    <style>

    body {
    background: #f7f0df;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    box-sizing: border-box;
}
        img {
    margin: 15px 0;
}
        .photo-collage {
    position: relative;
    width: 340px;
    height: 480px;
    margin: 20px auto 10px;
}

.photo {
    position: absolute;
    object-fit: cover;
    background: white;
    padding: 9px;
    box-sizing: border-box;
    box-shadow: 0 5px 14px rgba(80, 60, 50, 0.16);
}

.main-photo {
    width: 275px;
    height: 350px;
    left: 32px;
    top: 65px;
    transform: rotate(-2deg);
    z-index: 3;
}

.photo1 {
    width: 125px;
    height: 155px;
    left: 0;
    top: 20px;
    transform: rotate(-7deg);
    z-index: 2;
}

.photo2 {
    width: 130px;
    height: 155px;
    right: 0;
    top: 5px;
    transform: rotate(6deg);
    z-index: 2;
}

.photo3 {
    width: 120px;
    height: 145px;
    left: 5px;
    bottom: 25px;
    transform: rotate(5deg);
    z-index: 4;
}

.photo4 {
    width: 135px;
    height: 160px;
    right: 0;
    bottom: 10px;
    transform: rotate(-5deg);
    z-index: 2;
}

.photo5 {
    width: 110px;
    height: 135px;
    right: 35px;
    top: 175px;
    transform: rotate(8deg);
    z-index: 4;
}
    .decorations {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.decorations span {
    position: absolute;
    color: #d6b35a;
}

.star1 {
    top: 12%;
    left: 15%;
    font-size: 24px;
}

.star2 {
    top: 20%;
    right: 14%;
    font-size: 18px;
}

.star3 {
    top: 42%;
    left: 8%;
    font-size: 20px;
}

.star4 {
    bottom: 22%;
    right: 10%;
    font-size: 26px;
}

.star5 {
    bottom: 12%;
    left: 18%;
    font-size: 16px;
}
h1 {
    font-family: "Parisienne", cursive;
    font-size: 64px;
    font-weight: 400;
    color: #5b4a42;
    margin-bottom: 10px;
}

body {
    font-family: "Cormorant Garamond", serif;
}
</style>
</head>

<body>
   <h1>for Nikki ♡</h1> 
    <div class="decorations">
    <span class="star star1">✦</span>
    <span class="star star2">✧</span>
    <span class="star star3">⋆</span>
    <span class="star star4">✦</span>
    <span class="star star5">✧</span>
</div>

    
    <div class="photo-collage">

    <img src="photo1.jpeg" class="photo photo1" alt="Nikki">

    <img src="photo2.jpeg" class="photo photo2" alt="Nikki">

    <img src="IMG_9714.jpeg" class="photo main-photo" alt="Nikki">

    <img src="photo3.jpeg" class="photo photo3" alt="Nikki">

    <img src="photo4.jpeg" class="photo photo4" alt="Nikki">

    <img src="photo5.jpeg" class="photo photo5" alt="Nikki">

</div>

    <p>A little place for every version of you.</p>

    <button>begin our story ♡</button>

</body>
</html>
